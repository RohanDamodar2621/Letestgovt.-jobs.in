<style>
    .dashboard-container {
        max-width: 1000px;
        margin: 20px auto;
        padding: 10px;
    }
    .dashboard-title {
        background: #112233;
        color: white;
        padding: 10px 20px;
        border-radius: 30px;
        display: inline-block;
        font-weight: bold;
        margin-bottom: 20px;
    }
    .grid-box {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 15px;
    }
    .card-item {
        background: white;
        padding: 20px;
        text-align: center;
        border-radius: 10px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        text-decoration: none;
        color: #333;
        transition: 0.3s;
        border-top: 4px solid #004085;
    }
    .card-item:hover {
        transform: translateY(-3px);
        box-shadow: 0 5px 15px rgba(0,0,0,0.15);
    }
    .card-item h3 {
        margin: 10px 0 0 0;
        font-size: 16px;
        color: #004085;
    }
</style>

<div class="dashboard-container">
    <div class="dashboard-title">📁 Recruitment Dashboard</div>
    
    <div class="grid-box">
        <a href="#" class="card-item">
            <h3>Latest Recruitment</h3>
        </a>
        <a href="#" class="card-item">
            <h3>Railway Apprentice</h3>
        </a>
        <a href="#" class="card-item">
            <h3>Latest Apprentice</h3>
        </a>
        <a href="#" class="card-item">
            <h3>Latest Campus Placement</h3>
        </a>
        <a href="#" class="card-item">
            <h3>Merit List / Result</h3>
        </a>
        <a href="#" class="card-item">
            <h3>Answer Key</h3>
        </a>
        <a href="#" class="card-item">
            <h3>Admit Card</h3>
        </a>
        <a href="#" class="card-item">
            <h3>Syllabus</h3>
        </a>
    </div>
</div>
